# The documentation site (website/, built with docmd) at https://paperhive.abdullahcxd.org: a Cloudflare Worker
# serving static assets, deployed with wrangler (website/wrangler.jsonc).
# Pull requests and other branches: check links and build. The default branch (pushed or run by hand): also deploy.
# Needs the repository secrets CLOUDFLARE_ACCOUNT_TOKEN ("Edit Cloudflare Workers" template, zone abdullahcxd.org) and
# CLOUDFLARE_ACCOUNT_ID. See "Documentation site" in docs/architecture.md.
name: docs

on:
  push:
    branches: [main, development]
    paths: ['website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  docs:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && 'docs' || '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Check links
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Check the deploy
        run: npx wrangler deploy --dry-run
      - name: Deploy to paperhive.abdullahcxd.org
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
