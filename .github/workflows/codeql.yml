# CodeQL security analysis of the Java code (and the Kotlin build scripts), on changes and weekly.
name: codeql

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile
        run: ./gradlew assemble testClasses --no-build-cache
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
