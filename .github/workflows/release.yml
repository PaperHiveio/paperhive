# Push a tag v<version> (v0.1.0, v0.2.0-beta.1): build and test that version, publish every artifact to
# https://maven.abdullahcxd.org/releases, and create a GitHub release with the host jar and the Velocity plugin.
# Needs the repository secrets MAVEN_USERNAME and MAVEN_PASSWORD. See "Releasing" in docs/architecture.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: namespace-profile-paperhive
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build -Pversion="$VERSION"

      - name: Publish to maven.abdullahcxd.org
        env:
          ORG_GRADLE_PROJECT_abdullahcxdUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_abdullahcxdPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish -Pversion="$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Paperhive $VERSION" --generate-notes "${flags[@]}" \
            "paperhive-host/build/libs/paperhive-$VERSION.jar" \
            "paperhive-velocity/build/libs/paperhive-velocity-$VERSION.jar"
