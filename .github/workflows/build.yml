# ./gradlew build (compile + every unit test, the Gradle plugin's included) on Linux and Windows.
# The real-Paper tests (PaperInstanceIT, HivePluginLeakIT) are opt-in and need a Paper jar and the EULA; see docs/upgrading.md.
# Pushes to main or development also upload the host jar and the Velocity plugin as a (snapshot) workflow artifact.
name: build

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4 # also validates the wrapper jar
      - name: Build
        shell: bash  # Git Bash on Windows, so the same ./gradlew works on both
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Snapshot jars
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: paperhive-snapshot
          path: |
            paperhive-host/build/libs/paperhive-*.jar
            !paperhive-host/build/libs/paperhive-host-*.jar
            paperhive-velocity/build/libs/paperhive-velocity-*.jar
          retention-days: 14
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
