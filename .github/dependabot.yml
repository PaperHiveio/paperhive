# Weekly update PRs for Gradle and npm dependencies and GitHub Actions.
version: 2
updates:
  - package-ecosystem: gradle
    directories: ["/", "/paperhive-gradle"]
    schedule:
      interval: weekly
    # Paper and Velocity are pinned per Paperhive release and upgraded by hand (docs/upgrading.md)
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"
      - dependency-name: "com.velocitypowered:velocity-api"
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
