name: Feature request
description: An idea for Paperhive, the Hive API or the Gradle plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Paperhive to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
