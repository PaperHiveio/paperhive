name: Bug report
description: Something in Paperhive doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. paperhive.yml with ...
        2. start ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paperhive version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Java version and OS
      placeholder: Temurin 21.0.5, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: paperhive.yml (remove anything private)
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant part of logs/latest.log
      render: text
