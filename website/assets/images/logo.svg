<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Paperhive</title>
  <!-- Seven honeycomb cells (many servers, one hive); the centre one is a sheet of paper with a folded corner (Paper). -->
  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#F29E1F"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EEE4"/>
    </linearGradient>
    <!-- a flat-topped hexagon with a 34px radius, centred on 0,0 -->
    <path id="cell" d="M34 0 L17 29.44 L-17 29.44 L-34 0 L-17 -29.44 L17 -29.44 Z"/>
  </defs>

  <g stroke="#3A2A12" stroke-width="5" stroke-linejoin="round" fill="url(#honey)">
    <use href="#cell" x="128" y="62"/>
    <use href="#cell" x="185" y="95"/>
    <use href="#cell" x="185" y="161"/>
    <use href="#cell" x="128" y="194"/>
    <use href="#cell" x="71" y="161"/>
    <use href="#cell" x="71" y="95"/>
  </g>

  <!-- centre cell: the paper -->
  <g stroke="#3A2A12" stroke-width="5" stroke-linejoin="round">
    <path d="M162 128 L145 157.44 L111 157.44 L94 128 L111 98.56 L134 98.56 L152 110.6 Z" fill="url(#sheet)"/>
    <path d="M134 98.56 L138.2 108.7 L152 110.6 Z" fill="#E2D8C6"/>
  </g>
  <g stroke="#3A2A12" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="110" y1="124" x2="132" y2="124"/>
    <line x1="106" y1="135" x2="146" y2="135"/>
    <line x1="112" y1="146" x2="140" y2="146"/>
  </g>
</svg>
